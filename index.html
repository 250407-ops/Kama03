<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Монитор</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <!-- Профиль -->
    <div class="card">
        <h2>Мой профиль</h2>
        <p>Вы зашли как: <strong id="myinfo"></strong></p>

        <div class="buttons">
         <button class="btn green" onclick="changeStatus('📚 Учусь')">📚 Учусь</button>
<button class="btn yellow" onclick="changeStatus('☕ Кофе')">☕ Кофе</button>
<button class="btn blue" onclick="changeStatus('🎮 В игре')">🎮 В игре</button>
<button class="btn gray" onclick="changeStatus('🏠 Дома')">🏠 Дома</button>
        </div>
    </div>

    <!-- Группа -->
    <div class="card">
        <h2>Монитор группы</h2>

        <div id="grouplist">
            <div class="user-item">
                <div class="status-dot" style="background: orange;"></div>
                <div>
                    <strong>Almas</strong><br>
                    <span class="status-text">☕ Кофе-брейк</span>
                </div>
            </div>
        </div>

    </div>

</div>

</body>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const URL = 'https://kujwmgxvshbewvizbobu.supabase.co';
const KEY = 'sb_publishable_MQ_xOc_YYqjaReI67vIoVA_vEyRmG7m'; 

const supabase = createClient(URL, KEY);

const MY_ID = 'dd055fc3-eafc-4c8e-8b01-a05283f0806e';

window.changeStatus = async (text) => {
    const { error } = await supabase
        .from('profiles')
        .update({ status: text })
        .eq('id', MY_ID);

    if (error) {
        alert("Ошибка! Проверьте RLS политики в Supabase.");
        console.error(error);
    } else {
        fetchGroup();
    }
};

async function fetchGroup() {
    const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .order('username', { ascending: true });

    if (error) return console.error(error);

    const list = document.getElementById('grouplist');
    list.innerHTML = data.map(user => `
        <div class="user-item">
            <div class="status-dot"></div>
            <div style="flex-grow: 1">
                <strong>${user.username}</strong><br>
                <small style="color: #666;">${user.status || 'Статус не задан'}</small>
            </div>
        </div>
    `).join('');

    const me = data.find(u => u.id === MY_ID);
    if (me) document.getElementById('myinfo').innerText = `Вы: ${me.username}`;
}

fetchGroup();
setInterval(fetchGroup, 5000);
</script>
</body>
</html>
