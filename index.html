<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>База данных</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Список пользователей</h2>

<table class="db-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>Иван</td>
            <td>ivan@mail.com</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Анна</td>
            <td>anna@mail.com</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Олег</td>
            <td>oleg@mail.com</td>
        </tr>
    </tbody>
</table>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const URL = 'https://kujwmgxvshbewvizbobu.supabase.co';
const KEY = 'sb_publishable_MQ_xOc_YYqjaReI67vIoVA_vEyRmG7m'; 

const supabase = createClient(URL, KEY);

const MY_ID = 'dd055fc3-eafc-4c8e-8b01-a05283f0806e';

window.changeStatus = async (text, color) => {
    const { error } = await supabase
        .from('profiles')
        .update({ status: text, color: color })
        .eq('id', MY_ID);

    if (error) {
        alert("Ошибка! Проверьте RLS политики в Supabase.");
        console.error(error);
    } else {
        fetchGroup();
    }
};

async function fetchGroup() {
    const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .order('username', { ascending: true });

    if (error) return console.error(error);

    const list = document.getElementById('grouplist');
    list.innerHTML = data.map(user => `
        <div class="user-item">
            <div class="status-dot" style="background: ${user.color || '#ccc'}"></div>
            <div style="flex-grow: 1">
                <strong>${user.username}</strong><br>
                <small style="color: #666;">${user.status || 'Статус не задан'}</small>
            </div>
        </div>
    `).join('');

    const me = data.find(u => u.id === MY_ID);
    if (me) document.getElementById('myinfo').innerText = `Вы: ${me.username}`;
}

fetchGroup();
setInterval(fetchGroup, 5000);
</script>
</body>
</html>
